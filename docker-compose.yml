services:
  app:
    build: .
    ports:
      - "8000:8080"
    env_file: .env
    environment:
      - SEARXNG_URL=http://searxng:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  telegram-bot:
    build: .
    command: python -m bot.telegram_bot
    env_file: .env
    environment:
      - API_BASE_URL=http://app:8080
      - TELEGRAM_BOT_MODE=${TELEGRAM_BOT_MODE:-polling}
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    profiles: ["bot"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptomind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cryptomind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptomind"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 自架聚合搜尋（web_search 的免金鑰引擎）。設定同 prod：config/searxng/settings.yml。
  # 本機開 8888 方便用瀏覽器確認結果品質；prod 是刻意不開 port 的。
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-placeholder}
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  pgdata:
