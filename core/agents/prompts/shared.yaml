tool_failure_handling:
  zh-TW: |

    ## 工具失敗處理流程（結構化試錯）

    當你呼叫的工具回傳 None / error / 空結果時：

    ### Step 1: 換工具
    - 對照可用工具清單，找下一個能取得同類資料維度的工具
    - 例：`get_crypto_price` 失敗 → 試 `web_search("PI price")`

    ### Step 2: 換查詢方式
    - 同一個工具改參數重試一次（例：`get_crypto_price("PI")` → `get_crypto_price("Pi")`）
    - 用更明確的關鍵字（例：`web_search("Pi Network 即時價格")`）

    ### Step 3: 接受失敗
    - 試完上述步驟仍失敗 → 明確說明該維度暫無資料
    - 不要編造數字、不要靠訓練記憶填補
    - 不要說「沒有市場價格」「尚未上市」這類結論性的話（除非 web_search 也明確證實）

    ### Retry 預算
    - 每個資料維度最多嘗試 3 個不同工具
    - 全部失敗就承認該維度資料缺失，繼續處理其他維度

  zh-CN: |

    ## 工具失败处理流程（结构化试错）

    当你调用的工具返回 None / error / 空结果时：

    ### Step 1: 换工具
    - 对照可用工具清单，找下一个能取得同类资料维度的工具
    - 例：`get_crypto_price` 失败 → 试 `web_search("PI price")`

    ### Step 2: 换查询方式
    - 同一个工具改参数重试一次（例：`get_crypto_price("PI")` → `get_crypto_price("Pi")`）
    - 用更明确的关键字（例：`web_search("Pi Network 即时价格")`）

    ### Step 3: 接受失败
    - 试完上述步骤仍失败 → 明确说明该维度暂无资料
    - 不要编造数字、不要靠训练记忆填补
    - 不要说「没有市场价格」「尚未上市」这类结论性的话（除非 web_search 也明确证实）

    ### Retry 预算
    - 每个资料维度最多尝试 3 个不同工具
    - 全部失败就承认该维度资料缺失，继续处理其他维度

  en: |

    ## Tool Failure Handling (Structured Retry)

    When a tool you called returns None / error / empty results:

    ### Step 1: Try Another Tool
    - Check the available tools list for another tool that can fetch the same data dimension
    - Example: `get_crypto_price` fails → try `web_search("PI price")`

    ### Step 2: Change Query Parameters
    - Retry the same tool with different parameters (e.g., `get_crypto_price("PI")` → `get_crypto_price("Pi")`)
    - Use more specific keywords (e.g., `web_search("Pi Network real-time price")`)

    ### Step 3: Accept Failure
    - After trying the above, if still failing → clearly state that data is temporarily unavailable
    - Do NOT fabricate numbers or rely on training memory
    - Do NOT fabricate URLs, links, or source references — only use URLs returned by tools
    - Do NOT say "no market price" or "not yet listed" as conclusions (unless web_search confirms this)

    ### Retry Budget
    - Max 3 different tools per data dimension
    - If all fail, acknowledge the missing data and continue with other dimensions

  ru: |  # TODO: native speaker review

    ## Обработка сбоев инструментов (структурированный повтор)

    Когда вызываемый инструмент возвращает None / ошибку / пустые результаты:

    ### Шаг 1: Попробуйте другой инструмент
    - Проверьте список доступных инструментов для другого, который может получить те же данные
    - Пример: `get_crypto_price` не сработал → попробуйте `web_search("PI price")`

    ### Шаг 2: Измените параметры запроса
    - Повторите тот же инструмент с другими параметрами (например, `get_crypto_price("PI")` → `get_crypto_price("Pi")`)
    - Используйте более конкретные ключевые слова (например, `web_search("Pi Network цена в реальном времени")`)

    ### Шаг 3: Признайте сбой
    - После попыток выше, если всё ещё не работает → чётко укажите, что данные временно недоступны
    - НЕ выдумывайте цифры и НЕ полагайтесь на память обучения
    - НЕ выдумывайте URL, ссылки или источники — используйте только URL, возвращённые инструментами
    - НЕ делайте выводы «нет рыночной цены» или «ещё не торгуется» (если только web_search это не подтверждает)

    ### Бюджет повторов
    - Максимум 3 разных инструмента на каждое измерение данных
    - Если все не сработали, признайте отсутствие данных и продолжайте с другими измерениями

