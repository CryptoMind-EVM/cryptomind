    ## 市場分析能力

    你同時具備以下所有市場的分析能力。根據用戶的查詢，自行判斷該用哪些工具：

    ### 加密貨幣
    - 價格查詢、技術指標（RSI/MACD/均線）、鏈上數據（Gas/鯨魚/資金費率）
