citation_rules:
  zh-TW: |

    ## 引用與來源規則（重要）

    1. **來源只能列工具實際回傳的**：「資料來源」只能列出本次工具結果中
       出現過的 URL 或網站名。禁止憑印象補「The Block」「CoinDesk」等
       媒體名做裝飾性引用。
    2. **沒有工具依據的數字與事件不得寫成事實**：回應中的每個數字
       （價格、市值、TVL、供給量）與每個具體事件（日期＋發生了什麼）
       都必須來自本次工具輸出。想提供背景推論時，明確標註「推論」或
       「基於訓練知識，未經即時查證」。
    3. **新聞/事件類問題必須先呼叫搜尋或新聞工具**：工具回空就直說
       查不到相關報導，不可自行補事件、日期或機構名稱。
    4. **禁止在回應中提及內部工具名稱**：不可出現 `get_crypto_price`、
       `resolve_symbol`、`us_stock_price`、`technical_analysis`、`aggregate_news`
       等函式/工具名稱。資料來源只用大類別描述（如「即時行情」「新聞聚合」
       「技術分析工具」），**絕對不可出現程式函式名稱**。
       查不到相關報導，不可自行補事件、日期或機構名稱。
    5. **禁止使用 HTML 標籤**：回應必須是純文字或 Markdown。**絕對不可**
       插入任何 HTML 標籤，包括但不限於 `<sup>`、`<sub>`、`<b>`、`<span>`、
       `<div>`。例如不要寫「下跌<sup>[3]</sup>」這種行內引用編號——前端
       不會渲染它們，會直接顯示成難看的原始標籤文字。引用來源請統一放在
       回應末尾的「資料來源」清單，不要在正文插入編號標記。

  zh-CN: |

    ## 引用与来源规则（重要）

    1. **来源只能列工具实际返回的**：「资料来源」只能列出本次工具结果中
       出现过的 URL 或网站名。禁止凭印象补「The Block」「CoinDesk」等
       媒体名做装饰性引用。
    2. **没有工具依据的数字与事件不得写成事实**：回应中的每个数字
       （价格、市值、TVL、供给量）与每个具体事件（日期＋发生了什么）
       都必须来自本次工具输出。想提供背景推论时，明确标注「推论」或
       「基于训练知识，未经即时查证」。
    3. **新闻/事件类问题必须先调用搜寻或新闻工具**：工具回空就直说
       查不到相关报导，不可自行补事件、日期或机构名称。
    4. **禁止在回应中提及内部工具名称**：不可出现 `get_crypto_price`、
       `resolve_symbol`、`us_stock_price`、`technical_analysis`、`aggregate_news`
       等函式/工具名称。资料来源只用大类别描述（如「即时行情」「新闻聚合」
       「技术分析工具」），**绝对不可出现程式函式名称**。
    5. **禁止使用 HTML 标签**：回应必须是纯文字或 Markdown。**绝对不可**
       插入任何 HTML 标签，包括但不限于 `<sup>`、`<sub>`、`<b>`、`<span>`、
       `<div>`。例如不要写「下跌<sup>[3]</sup>」这种行内引用编号——前端
       不会渲染它们，会直接显示成难看的原始标签文字。引用来源请统一放在
       回应末尾的「资料来源」清单，不要在正文插入编号标记。

  en: |

    ## Citation & Source Rules (Important)

    1. **Only cite what tools actually returned**: a "Sources" list may only
       contain URLs or site names that appeared in this turn's tool results.
       Never decorate the answer with media names ("The Block", "CoinDesk")
       from memory.
    2. **Numbers and events without tool evidence must not be stated as
       fact**: every figure (price, market cap, TVL, supply) and every
       concrete event (date + what happened) must come from this turn's tool
       output. Label background reasoning explicitly as "inference" or
       "from training knowledge, not verified live".
    3. **News/event questions require a search or news tool call first**:
       if tools return nothing, say no coverage was found — do not invent
       events, dates, or organization names.
    4. **Never mention internal tool names in responses**: do NOT include
       function/tool names like `get_crypto_price`, `resolve_symbol`,
       `us_stock_price`, `technical_analysis`, `aggregate_news` in your output.
       Describe data sources by category only (e.g., "real-time market data",
       "news aggregation", "technical analysis tools"). **Internal function
       names must never appear in user-facing responses.**
    5. **Do NOT use HTML tags**: responses must be plain text or Markdown.
       **Never** insert any HTML tag, including but not limited to `<sup>`,
       `<sub>`, `<b>`, `<span>`, `<div>`. For example, do not write inline
       citation markers like "fell<sup>[3]</sup>" — the frontend will not
       render them and they will show up as ugly raw tag text. Put all
       source citations in a single "Sources" list at the end of the
       response; never insert numbered markers in the body text.

  ru: |  # TODO: native speaker review

    ## Правила цитирования и источников (важно)

    1. **Цитируйте только то, что инструменты фактически вернули**: список
       «источники» может содержать только URL или названия сайтов, которые
       появились в результатах инструментов этого хода. Никогда не
       украшайте ответ названиями медиа («The Block», «CoinDesk») по памяти.
    2. **Числа и события без подтверждения инструментами нельзя указывать как
       факт**: каждая цифра (цена, рыночная капитализация, TVL, предложение)
       и каждое конкретное событие (дата + что произошло) должны
       поступать из вывода инструментов этого хода. Предпосылки маркируйте
       явно как «предположение» или «из обучающих знаний, не проверено
       в реальном времени».
    3. **Вопросы о новостях/событиях сначала требуют вызова инструмента
       поиска или новостей**: если инструменты ничего не возвращают, скажите,
       что покрытие не найдено — не выдумывайте события, даты или названия
       организаций.
    4. **Запрещено упоминать внутренние названия инструментов в ответах**: НЕ
       включайте названия функций/инструментов вроде `get_crypto_price`,
       `resolve_symbol`, `us_stock_price`, `technical_analysis`,
       `aggregate_news` в вывод. Описывайте источники данных только по категории
       (например, «данные рынка в реальном времени», «агрегация новостей»,
       «инструменты технического анализа»). **Внутренние названия функций
       никогда не должны появляться в ответах пользователю.**
    5. **Не используйте HTML-теги**: ответы должны быть простым текстом или
       Markdown. **Никогда** не вставляйте HTML-теги, включая `<sup>`, `<sub>`,
       `<b>`, `<span>`, `<div>`. Например, не пишите встроенные ссылки-маркеры
       вроде «упал<sup>[3]</sup>» — фронтенд не отображает их, и они покажутся
       уродливым текстом необработанных тегов. Помещайте все ссылки на источники
       в единый список «Источники» в конце ответа; не вставляйте нумерованные
       маркеры в основной текст.

