# Shared prompt fragments — multi-language (zh-TW / zh-CN / en / ru).
#
# Governance: every top-level key MUST have all 4 languages.
# Tests/test_prompt_governance.py enforces this — adding a new language or
# a new key without covering all 4 will fail CI.
#
# ru translations are machine-translated; TODO marks entries that need a
# native speaker review before production use.

# ============================================================================
# output_language — 強制 LLM 以 UI 語言輸出（Bug#2 修復）。
#
# 背景：base_react_agent.execute_streaming 刻意拆掉 LanguageAwareLLM wrapper，
# 改讓「語言靠 system prompt」。但原本 system prompt 只翻譯了「內容」、漏了
# 「輸出語言要求」，導致英文 UI 仍輸出中文。本區塊補回明確的輸出語言指示。
# 位置：sections 最前面（base role 之後第一個），確保優先級最高。
# ============================================================================
output_language:
  zh-TW: |

    ## 輸出語言（最重要）
    你必須以**繁體中文**回覆所有內容——分析、說明、數字格式、結論。
    即使工具回傳的資料、使用者引用的文字、或訓練資料傾向其他語言，
    你的最終輸出仍必須是繁體中文。專有名詞（如 BTC、RSI、TON）保持原文。

  zh-CN: |

    ## 输出语言（最重要）
    你必须以**简体中文**回复所有内容——分析、说明、数字格式、结论。
    即使工具返回的数据、用户引用的文字、或训练数据倾向其他语言，
    你的最终输出仍必须是简体中文。专有名词（如 BTC、RSI、TON）保持原文。

  en: |

    ## Output Language (Most Important)
    You MUST respond in **English** for ALL output — analysis, explanations,
    number formatting, and conclusions. Even if tool results, user-quoted text,
    or your training bias toward another language, your final output must be
    in English. Keep proper nouns (e.g., BTC, RSI, TON) as-is.

  ru: |

    ## Язык вывода (самое важное)
    Вы ДОЛЖНЫ отвечать на **русском языке** для всего вывода — анализ,
    пояснения, формат чисел и выводы. Даже если данные инструментов, цитаты
    пользователя или ваши тренировочные данные склоняются к другому языку,
    итоговый вывод должен быть на русском. Имена собственные (BTC, RSI, TON)
    оставляйте как есть.
  # TODO ru: native speaker review

