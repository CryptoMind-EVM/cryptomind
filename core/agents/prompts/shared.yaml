         步骤引述 → 接着调用 `fetch_url(url=...)` 读全文
    3. **不认识或无法确认的代号/标的名稱** → 先 `resolve_symbol`（必要时带
       `use_web_search=True`），确认后再下游
    4. **冷门币种、新标的、暱稱、中文名** → 一定先 `resolve_symbol` 或
