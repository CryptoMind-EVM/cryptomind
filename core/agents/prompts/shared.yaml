symbol_resolution_protocol:
  zh-TW: |

    ## 標準代號解析協定（resolve_symbol 工具使用）

    當你不確定資產的標準代號（中文名、暱稱、新標的）時：

    ### Step 0: 多義 Ticker 偵測（任何 2-6 字大寫英文代號，例如 AKE / FOX / LINE）
    短代號極可能同時存在於「加密 + 美股 + 其他市場」（例：AKE 可能是 Akedo 加密幣、
    Arkema 法股、Allkem 已下市澳股）。**先別急著查**，先判斷：
    - 若用戶已明確說市場（「加密 AKE」「美股 FOX」）→ 跳過此步
    - 若代號是 BTC/ETH/USDT 等主流加密，或 AAPL/TSLA 等知名美股 → 跳過此步
    - **其他情況（短英文代號、沒指定市場）→ 呼叫 `resolve_symbol_all_markets(query="AKE")`**
      - 並行查所有市場，回傳候選清單
      - 若 `ambiguous: true`：**列出所有候選給使用者選**（誠實標明「本平台不支援」
        的市場），讓使用者回覆想看哪個或「全部」
      - **絕對禁止**：在沒取得真實資料前，編造「正在獲取即時價格」「RSI 分析」
        「根據最新數據」等假訊息。查不到就明說查不到，問使用者要查哪個

    ### Step 1: 第一次 resolve（快速 API 路徑）
    - `resolve_symbol(query="名稱", market="<市場>")`
    - **重要**：`market=auto` 預設走 crypto（CoinGecko）。若代號看起來不像加密貨幣
      （例如全大寫英文 + 數字 like SNXX、TSM、2330），**直接指定正確市場**：
      - tw: 可中文（「台積電」「鴻海」）
      - us: 美股代號（SNXX、AAPL、TSLA）
      - hk/jp/kr/in: 各國市場
      - 其他市場: 建議翻成英文（騰訊→Tencent / 豐田→Toyota / 三星→Samsung）
    - 若回傳 `symbol != null` → ✅ 直接用此 symbol 呼叫下游工具

    ### Step 2: 失敗時兩種 retry
    若第一次回傳 `{"symbol": null}`：
    - **2a. 換市場重試**：若剛才用 `market=auto` 或某市場失敗，且代號可能是其他市場
      （例如英文代號極可能是美股），**改用 `market=us` 重試**：
      `resolve_symbol(query="...", market="us")`
    - **2b. web_search retry**：仍失敗再叫一次
      `resolve_symbol(query="...", market="...", use_web_search=True)`
      - web_search 較慢但對冷門/新標的命中率高
      - 內含 post-verification 防止 false positive（驗證後才回 verified=True）

    ### Step 3: 全部失敗
    - 明確告知用戶「目前無法解析此資產代號」
    - 不要瞎猜代號、不要用訓練記憶湊
    - 可建議用戶提供標準代號（如「2330」「BTC」）

    ### 結果驗證
    拿到 symbol 後呼叫下游工具，**必須檢查**：
    - [ ] 工具回傳的標的名稱跟用戶問的一致嗎？（不一致 → 重新 resolve）
    - [ ] 數據合理嗎？（價格 > 0、日期非 1970）

