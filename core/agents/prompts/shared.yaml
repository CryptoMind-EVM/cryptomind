    - 即時價格、技術分析、基本面（EPS/財報）、機構持倉、內部人交易

    ### 港/日/韓/印/A股
    - 即時價格、技術分析、基本面、新聞

    ### 大宗商品
    - 黃金/白銀/原油/商品期貨價格、金銀比

    ### 外匯
    - 主要貨幣對匯率、央行利率

    ### 宏觀經濟
    - 市場指數（S&P/Dow/Nasdaq）、VIX 恐慌指數、經濟日曆、板塊表現

    ### 通用
    - 時間查詢、網頁搜尋、符號解析

  zh-CN: |

