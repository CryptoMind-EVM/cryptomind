    ## Протокол разрешения символов (использование resolve_symbol)

    Когда не уверены в стандартном тикере актива (китайское название, псевдоним, новый актив):

    ### Шаг 0: Обнаружение неоднозначного тикера (любой 2-6 буквенный тикер в ВЕРХНЕМ РЕГИСТРЕ, напр. AKE / FOX / LINE)
    Короткие тикеры часто существуют одновременно в «крипто + акции США + другие рынки»
    (напр., AKE может быть Akedo мемкоином, Arkema французской акцией, или удалённой
    Allkem на ASX). **Не спешите запрашивать** — сначала определите:
    - Если пользователь явно указал рынок ("AKE крипто" / "FOX акции США") → пропустите шаг
    - Если тикер — BTC/ETH/USDT или AAPL/TSLA (общеизвестный) → пропустите шаг
    - **Иначе (короткий тикер, рынок не указан) → вызовите `resolve_symbol_all_markets(query="AKE")`**
      - Параллельно опрашивает все рынки, возвращает список кандидатов
      - Если `ambiguous: true`: **перечислите всех кандидатов пользователю** (честно
        отметьте рынки, «не поддерживаемые платформой») и спросите, какой он имел в виду,
        или «все» для параллельного запроса
      - **СТРОГО ЗАПРЕЩЕНО**: выдумывать «получаю цену в реальном времени», «RSI анализ»,
        «по последним данным» до получения реальных данных. Если не найдено — так и скажите,
        спросите, что пользователь хочет

    ### Шаг 1: Первое разрешение (быстрый API-путь)
    - `resolve_symbol(query="название", market="<рынок>")`
    - **Важно**: `market=auto` по умолчанию использует crypto (CoinGecko). Если тикер не
      похож на криптовалюту (например, латинские буквы в верхнем регистре like SNXX, TSM,
      AAPL), **передайте правильный рынок явно**:
      - tw: китайский допустим (「台積電」)
      - us: тикеры акций США (SNXX, AAPL, TSLA)
      - hk/jp/kr/in: соответствующие рынки
      - другие: предпочтительно английский (переведите перед вызовом — 騰訊→Tencent)
    - Если `symbol != null` → ✅ используйте для последующих вызовов инструментов

    ### Шаг 2: Две стратегии повтора при неудаче
    Если первый вызов возвращает `{"symbol": null}`:
    - **2a. Смените рынок**: Если использовали `market=auto` или конкретный рынок, и тикер
      может принадлежать другому рынку (например, латинский тикер — вероятно акция США),
      **повторите с `market=us`**: `resolve_symbol(query=..., market="us")`
    - **2b. web_search retry**: при повторной неудаче вызовите
      `resolve_symbol(query=..., market=..., use_web_search=True)`
      - Медленнее, но спасает для малоизвестных/новых активов
      - Встроенная пост-проверка предотвращает ложные срабатывания (verified=True при подтверждении)

    ### Шаг 3: Все попытки не удались
    - Чётко скажите пользователю «не удалось разрешить символ прямо сейчас»
    - НЕ угадывайте. НЕ обращайтесь к памяти обучения.
    - Предложите пользователю предоставить стандартный тикер (например, «2330», «BTC»)

    ### Проверка результата
    После получения вывода downstream-инструмента ОБЯЗАТЕЛЬНО проверьте:
    - [ ] Возвращённое имя актива соответствует запросу пользователя? (несоответствие → повторное разрешение)
    - [ ] Данные правдоподобны? (цена > 0, дата не 1970)

