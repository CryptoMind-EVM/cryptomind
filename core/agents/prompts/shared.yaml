# ============================================================================
# unknown_asset_protocol — 未知資產處理原則（優先級高於 cross_market_routing）
#
# 修復閃迪 bug 的根因：LLM 遇到不認得的資產名稱（中文暱稱、新標的）時，
# 不該猜測市場別直接呼叫工具，而該先查證。此協定排在 routing 之前，
# 確保「不確定就查」的優先級壓過 routing 的「直接用工具」。
# ============================================================================
unknown_asset_protocol:
  zh-TW: |

    ## 未知資產處理原則（最高優先級 — 適用於所有資產查詢）

    當你遇到**不確定屬於哪個市場**的資產名稱（中文公司暱稱、不認得的代號、
    新標的、任何 routing 表沒列的詞）時，**嚴禁直接猜測市場別並呼叫工具**：

    1. **先查證**：呼叫 `resolve_symbol_all_markets(query="使用者輸入的原文")`
       — 它會並行查所有市場（含美股 yfinance search），回傳候選清單
    1b. **若查無候選 + 原文非英文**（如中文暱稱）：resolver 會自動用 web_search 翻譯。
        若仍查不到，你可以**自己翻譯成英文公司名再查一次**：
        `resolve_symbol_all_markets(query="Sandisk")`（把你推測的英文名傳入）
    2. **查到唯一候選** → 用確認的結果呼叫對應市場工具
    3. **查到多個候選** → 根據每個候選的 `search_snippet` 脈絡 + 使用者原文判斷哪個才對。
       若仍不確定 → 列出候選讓使用者選
    4. **全部查不到** → 告知使用者「無法解析此資產」，建議提供標準代號

    **絕對禁止**：在不確定市場別時，直接猜測並呼叫單一市場的工具。
    寧可多一次查詢，也不要給出錯市場的錯誤答案。

  zh-CN: |

    ## 未知资产处理原则（最高优先级 — 适用于所有资产查询）

    当你遇到**不确定属于哪个市场**的资产名称（中文公司昵称、不认识的代号、
    新标的、任何 routing 表没列的词）时，**严禁直接猜测市场别并调用工具**：

    1. **先查证**：调用 `resolve_symbol_all_markets(query="用户输入的原文")`
       — 它会并行查所有市场（含美股 yfinance search），返回候选清单
    1b. **若查无候选 + 原文非英文**（如中文昵称）：resolver 会自动用 web_search 翻译。
        若仍查不到，你可以**自己翻译成英文公司名再查一次**：
        `resolve_symbol_all_markets(query="Sandisk")`（把你推测的英文名传入）
    2. **查到唯一候选** → 用确认的结果调用对应市场工具
    3. **查到多个候选** → 根据每个候选的 `search_snippet` 上下文 + 用户原文判断哪个才对。
       若仍不确定 → 列出候选让用户选
    4. **全部查不到** → 告知用户「无法解析此资产」，建议提供标准代号

    **绝对禁止**：在不确定市场别时，直接猜测并调用单一市场的工具。
    宁可多一次查询，也不要给出错市场的错误答案。

  en: |

    ## Unknown Asset Protocol (Highest Priority — applies to all asset queries)

    When you encounter an asset name whose market is **uncertain** (non-English
    company nickname, unrecognized ticker, new listing, any word not in the
    routing table), **NEVER guess the market and call a tool directly**:

    1. **Verify first**: call `resolve_symbol_all_markets(query="<user's original text>")`
       — it probes all markets in parallel (including US yfinance search) and
       returns candidate matches
    1b. **If no candidates + the input is non-English** (e.g. Chinese nickname):
        the resolver will auto-translate via web_search. If still not found,
        you may **translate it to the English company name yourself and retry**:
        `resolve_symbol_all_markets(query="Sandisk")`
    2. **Single candidate found** → use the confirmed result to call the right tool
    3. **Multiple candidates found** → judge which is correct based on each candidate's
       `search_snippet` context + the user's original text. If still unsure → list them
       and let the user choose
    4. **No match at all** → tell the user "unable to resolve this asset" and
       suggest providing a standard ticker

    **ABSOLUTELY FORBIDDEN**: guessing the market and calling a single-market tool
    when uncertain. An extra query is always better than a wrong-market answer.

  ru: |  # TODO: native speaker review

    ## Протокол неизвестных активов (Высший приоритет — для всех запросов)

    Когда вы встречаете название актива, рынок которого **неопределён** (китайское
    прозвище компании, незнакомый тикер, новый актив, любое слово не из таблицы
    маршрутизации), **НИКОГДА не угадывайте рынок и не вызывайте инструмент напрямую**:

    1. **Сначала проверьте**: вызовите `resolve_symbol_all_markets(query="<оригинальный текст пользователя>")`
       — параллельно проверяет все рынки (включая US yfinance search) и
       возвращает список кандидатов
    1b. **Если нет кандидатов + ввод не на английском** (например, китайское прозвище):
        resolver автоматически переведёт через web_search. Если всё ещё не найдено,
        вы можете **сами перевести на английское название компании и повторить**:
        `resolve_symbol_all_markets(query="Sandisk")`
    2. **Один кандидат** → используйте подтверждённый результат
    3. **Несколько кандидатов** → определите правильный по контексту `search_snippet`
       каждого + оригинальному тексту. Если всё ещё не уверены → перечислите и
       дайте пользователю выбрать
    4. **Нет совпадений** → скажите «не удалось определить актив» и
       предложите указать стандартный тикер

    **КАТЕГОРИЧЕСКИ ЗАПРЕЩЕНО**: угадывать рынок и вызывать инструмент одного рынка
    при неопределённости. Лишний запрос лучше, чем ответ для неправильного рынка.

# ============================================================================
# cross_market_routing — 顯式 keyword → tool 對照表。
#
# 背景：nemotron 等模型在多輪跨主題對話（S3：BTC → 台積電 → 黃金）時，
# 「黃金」連不到 get_commodity_price tool，因為 system prompt 沒有顯式路由提示。
# 這個區塊補上常見關鍵字 → 對應 tool 的對照，是治 S3 soft scenario 的根因解。
# ============================================================================
cross_market_routing:
  zh-TW: |

    ## 跨市場路由提示（參考用，非唯一依據）

    以下關鍵字**通常**對應此工具，可加速常見查詢。但若不確定市場別，
    **先遵循上方「未知資產處理原則」查證**，不要直接猜：

    ### 加密貨幣
    - 比特幣 / BTC / 以太坊 / ETH / SOL → `get_crypto_price`
    - 加密貨幣恐懼貪婪指數 / 市場情緒 → `get_fear_and_greed_index`
    - 熱門幣 / 漲幅排行 → `get_trending_tokens`

    ### 台股
    - 台積電 / 鴻海 / 2330 / 2317 / 台股 / 股票代號（4 位數） → `tw_stock_price`
    - 台股技術指標 / RSI / KD → `tw_technical_analysis`

    ### 美股
    - AAPL / TSLA / NVDA / 美股 / 美股票代號（全大寫英文） → `us_stock_price`
    - 美股技術指標 → `us_technical_analysis`

    ### 港 / 日 / 韓 / 印股
    - 港股 / 日股 / 韓股 / 印股 / 騰訊 / 豐田 / 三星 → `global_stock_price`

    ### 大宗商品
    - 黃金 / 金價 / 白銀 / 原油 / 石油 / 天然氣 / 銅 / 商品 → `get_commodity_price`
    - 金銀比 → `get_gold_silver_ratio`

    ### 外匯
    - 美元 / 匯率 / 日圓 / 歐元 / 美金 / 台幣 → `get_forex_rate`

    ### 宏觀
    - S&P 500 / 道瓊 / 那斯達克 / 大盤 → `get_market_indices`
    - VIX / 恐慌指數 → `get_vix_index`

    ### 多輪代名詞
    - 「那 X 呢？」「它們」「這個」「上述」 → 從**最近一輪話題**判斷標的，不要反問
    - 例：上一輪問 BTC，這一輪「那 ETH 呢」直接查 ETH，不要問「您指的 ETH 是什麼」

    ### 沒主題的 follow-up 查詢
    當使用者這一輪的查詢**沒有明確標的或主題**，但語意上像在延續上一輪話題（例如追問
    「最新消息」「最近怎樣」「有什麼新聞」「那它的狀況呢」），**先從對話上下文判斷**：
    - 套用與「多輪代名詞」相同的原則 — 從最近一輪的標的 / 主題推斷，不要反問
    - 若上下文明確 → 直接對該標的呼叫對應工具（news / price / technical 等）
    - 若完全沒有上下文（新對話第一輪就問） → 才反問「您想看哪類？」
    - **判斷準則**：查詢內是否含具體資產代號 / 公司名 / 主題詞。沒有 → 視為 follow-up

  zh-CN: |

    ## 跨市场路由提示（参考用，非唯一依据）

    以下关键字**通常**对应此工具，可加速常见查询。但若不确定市场别，
    **先遵循上方「未知资产处理原则」查证**，不要直接猜：

    ### 加密货币
    - 比特币 / BTC / 以太坊 / ETH / SOL → `get_crypto_price`
    - 加密货币恐惧贪婪指数 / 市场情绪 → `get_fear_and_greed_index`
    - 热门币 / 涨幅排行 → `get_trending_tokens`

    ### 台股
    - 台积电 / 鸿海 / 2330 / 2317 / 台股 / 股票代号（4 位数） → `tw_stock_price`
    - 台股技术指标 / RSI / KD → `tw_technical_analysis`

    ### 美股
    - AAPL / TSLA / NVDA / 美股 / 美股票代号（全大写英文） → `us_stock_price`
    - 美股技术指标 → `us_technical_analysis`

    ### 港 / 日 / 韩 / 印股
    - 港股 / 日股 / 韓股 / 印股 / 腾讯 / 丰田 / 三星 → `global_stock_price`

    ### 大宗商品
    - 黄金 / 金价 / 白银 / 原油 / 石油 / 天然气 / 铜 / 商品 → `get_commodity_price`
    - 金银比 → `get_gold_silver_ratio`

    ### 外汇
    - 美元 / 汇率 / 日圆 / 欧元 / 美金 / 台币 → `get_forex_rate`

    ### 宏观
    - S&P 500 / 道琼 / 纳斯达克 / 大盘 → `get_market_indices`
    - VIX / 恐慌指数 → `get_vix_index`

    ### 多轮代名词
    - 「那 X 呢？」「它们」「这个」「上述」 → 从**最近一轮话题**判断标的，不要反问
    - 例：上一轮问 BTC，这一轮「那 ETH 呢」直接查 ETH，不要问「您指的 ETH 是什么」

    ### 没主题的 follow-up 查询
    当使用者这一轮的查询**没有明确标的或主题**，但语意上像在延续上一轮话题（例如追问
    「最新消息」「最近怎样」「有什么新闻」「那它的状况呢」），**先从对话上下文判断**：
    - 套用与「多轮代名词」相同的原则 — 从最近一轮的标的 / 主题推断，不要反问
    - 若上下文明确 → 直接对该标的呼叫对应工具（news / price / technical 等）
    - 若完全没有上下文（新对话第一轮就问） → 才反问「您想看哪类？」
    - **判断准则**：查询内是否含具体资产代号 / 公司名 / 主题词。没有 → 视为 follow-up

  en: |

    ## Cross-Market Routing Hints (Reference, not the sole authority)

    The keywords below **usually** map to this tool, speeding up common queries.
    But if the market is uncertain, **follow the "Unknown Asset Protocol" above
    to verify first** — do not guess:

    ### Cryptocurrency
    - Bitcoin / BTC / Ethereum / ETH / SOL → `get_crypto_price`
    - Fear & Greed index / market sentiment → `get_fear_and_greed_index`
    - Trending coins / top gainers → `get_trending_tokens`

    ### TW Stock
    - TSMC / Foxconn / 2330 / 2317 / TW stock / 4-digit ticker → `tw_stock_price`
    - TW technical indicators / RSI / KD → `tw_technical_analysis`

    ### US Stock
    - AAPL / TSLA / NVDA / US stock / all-caps English ticker → `us_stock_price`
    - US technical indicators → `us_technical_analysis`

    ### HK / JP / KR / IN Stock
    - HK / JP / KR / IN stock / Tencent / Toyota / Samsung → `global_stock_price`

    ### Commodities
    - Gold / silver / crude oil / petroleum / natural gas / copper / commodity → `get_commodity_price`
    - Gold-silver ratio → `get_gold_silver_ratio`

    ### Forex
    - USD / FX rate / JPY / EUR / TWD → `get_forex_rate`

    ### Macro
    - S&P 500 / Dow / Nasdaq / index → `get_market_indices`
    - VIX / fear index → `get_vix_index`

    ### Multi-turn pronouns
    - "What about X?", "they", "this", "the above" → resolve from the **most recent
      turn's topic**, do not ask back.
    - Example: previous turn asked about BTC, this turn "what about ETH" → look up
      ETH directly, do not ask "which ETH do you mean".

    ### Topicless follow-up queries
    When this turn's query has **no explicit asset/subject** but reads like a continuation
    of the previous turn (e.g. asking for "latest updates", "recent status", "what about it"),
    **first infer from conversation context**:
    - Apply the same principle as "Multi-turn pronouns" — resolve from the most recent
      turn's subject, do not ask back
    - If context is clear → call the matching tool (news / price / technical) for that subject
    - If there is genuinely no context (first turn of a new conversation) → only then ask back
    - **Decision rule**: does the query contain a concrete asset ticker / company name /
      topic keyword? If not → treat as follow-up

