<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="seo.scamDetail">Report Detail - Scam Wallet Tracker</title>
    <link rel="icon" type="image/png" href="/static/img/title_icon.png">
    <link rel="stylesheet" href="/static/css/tailwind-built.css?v=52">
    <script src="https://unpkg.com/lucide@0.577.0" crossorigin="anonymous" integrity="sha384-orgVf2eX2+m1zKAOIi09hD0W6GtVhoOUmqDK+sysYB2JTZ4vS86j4jm+X7a4Nnei"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.7.6/i18next.min.js" crossorigin="anonymous" integrity="sha384-OCCT+KZFt2FsqTxlTd8CUSq86zW/ZKmV0oe7qj36oye2CDbbVuxIXTY20t/u9LJt"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=46">
    <!-- TON Connect SDK loaded via main page -->
    <!-- TON Connect SDK loaded via main page -->
    <!-- early-init: 防 FOUC + 預設主題（與主站共用 localStorage.selectedTheme） -->
    <script src="/js/early-init.js"></script>
</head>
<body class="bg-background text-textMain min-h-screen" data-page="scam-detail">
    <nav class="sticky top-0 z-50 bg-surface/95 backdrop-blur-xl border-b border-borderSubtle px-4 py-3">
        <div data-theme-toggle-gap class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-x-3 gap-y-2 pr-12">
            <a href="/static/index.html#scamcheck" class="flex items-center gap-2 text-secondary font-bold hover:text-primary transition">
                <i data-lucide="arrow-left" class="w-5 h-5 shrink-0"></i>
                <span class="whitespace-nowrap" data-i18n="scamcheck.backToCheck">Back to Scam Check</span>
            </a>
            <div class="font-bold text-lg text-primary text-center" data-i18n="safety.reportDetail">Report Detail</div>
            <!-- 語言：跟主站同一個四語切換器（scam-tracker-i18n.js 掛上；讀寫 localStorage.selectedLanguage） -->
            <div id="scam-lang-switcher" class="header-lang-switcher shrink-0"></div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div id="report-detail" class="bg-surface border border-borderSubtle rounded-2xl p-6 mb-6">
            <div class="text-center text-textMuted py-8" data-i18n="safety.loadingDetail">Loading report detail...</div>
        </div>

        <div class="bg-surface border border-borderSubtle rounded-2xl p-6 mb-6">
            <h3 class="font-bold text-secondary mb-4" data-i18n="safety.voteSection">Community Review</h3>
            <div class="flex items-center gap-4 mb-4">
                <button id="btn-approve" class="flex-1 bg-success/10 hover:bg-success/20 text-success border border-success/30 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                    <i data-lucide="thumbs-up" class="w-5 h-5"></i>
                    <span><span data-i18n="safety.voteApprove">Approve</span> (<span id="count-approve">0</span>)</span>
                </button>
                <button id="btn-reject" class="flex-1 bg-danger/10 hover:bg-danger/20 text-danger border border-danger/30 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2">
                    <i data-lucide="thumbs-down" class="w-5 h-5"></i>
                    <span><span data-i18n="safety.voteReject">Reject</span> (<span id="count-reject">0</span>)</span>
                </button>
            </div>
            <div class="bg-background rounded-xl p-4">
                <div class="flex justify-between text-sm text-textMuted mb-2">
                    <span data-i18n="safety.voteProgress">Approval Ratio</span>
                    <span id="vote-percentage">0%</span>
                </div>
                <div class="h-2 bg-surfaceHighlight rounded-full overflow-hidden">
                    <div id="vote-progress-bar" class="h-full bg-primary transition-all duration-300" style="width: 0%"></div>
                </div>
                <p class="text-xs text-textMuted mt-2 text-center" data-i18n="safety.voteHint">
                    When at least 10 votes are collected and approval exceeds 70%, the report can be auto-verified.
                </p>
            </div>
        </div>

        <div class="bg-surface border border-borderSubtle rounded-2xl p-6">
            <h3 class="font-bold text-secondary mb-4 flex items-center gap-2">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
                <span data-i18n="safety.commentsTitle">Evidence & Comments</span>
            </h3>
            <div id="comment-form" class="mb-6 hidden">
                <textarea
                    id="comment-content"
                    data-i18n="safety.commentPlaceholder"
                    data-i18n-attr="placeholder"
                    placeholder="Share verifiable evidence or context. PRO members can comment here..."
                    class="w-full bg-background border border-borderLight rounded-xl p-3 text-textMain focus:border-primary outline-none min-h-[100px] mb-2"
                ></textarea>
                <input
                    type="text"
                    id="comment-tx-hash"
                    data-i18n="safety.commentTxPlaceholder"
                    data-i18n-attr="placeholder"
                    placeholder="Transaction hash (optional)"
                    class="w-full bg-background border border-borderLight rounded-xl px-3 py-2 text-textMain focus:border-primary outline-none mb-3"
                >
                <div class="flex justify-end">
                    <button id="btn-submit-comment" class="bg-primary text-background px-6 py-2 rounded-lg font-bold hover:opacity-90 transition" data-i18n="safety.submitComment">
                        Submit Comment
                    </button>
                </div>
            </div>
            <div id="comments-list" class="space-y-4">
                <div class="text-center text-textMuted py-4" data-i18n="safety.loadingComments">Loading comments...</div>
            </div>
        </div>
    </main>

    <div id="toast-container" role="status" aria-live="polite" aria-atomic="true"
        class="fixed z-[110] flex flex-col gap-3 pointer-events-none bottom-4 left-4 right-4 items-center md:bottom-auto md:top-24 md:left-auto md:right-4 md:items-end"
        style="bottom: var(--shell-toast-bottom, calc(1rem + env(safe-area-inset-bottom, 0px)));"></div>

    <script src="/static/config.js"></script>
    <script src="/static/js/click-delegator.js?v=3"></script>
    <script src="/static/js/logger.js"></script>
    <script type="module" src="/static/js/classic-compat-app.js?v=2"></script>
    <script src="/static/scam-tracker/js/scam-tracker.js?v=55"></script>
    <script src="/static/scam-tracker/js/scam-tracker-i18n.js?v=7"></script>
    <script src="/static/scam-tracker/js/scam-tracker-boot.js?v=2" data-page="detail"></script>
    <!-- 子頁主題切換鈕（右上角） -->
    <script src="/js/components/ThemeToggle.js"></script>
    <script src="/js/site-sidebar.js?v=4"></script>
</body>
</html>
