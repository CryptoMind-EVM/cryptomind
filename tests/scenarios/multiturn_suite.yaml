  # ============================================================
  # 情境 25：詐騙偵測（CryptoMind 核心功能）
  # "Is this legit?" "Is it a scam?"
  # ============================================================
  - id: "S25-scam-detection"
    category: scam_safety
    language: "zh-TW"
