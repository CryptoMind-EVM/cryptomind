# Multiturn Scenario Suite — CryptoMind agent 回歸測試問題集
#
# 用途：手動或自動跑一次完整流程，驗證 agent 的關鍵行為沒被改壞。
# 每個 scenario 是一個獨立 session（不延續上一個）。
#
# 欄位說明：
#   id:          唯一識別碼
#   category:    情境分類
#   language:    該 session 的 UI 語言
#   turns:       多輪對話（同一個 session_id，測多輪記憶 + 切換）
#     - query:                使用者問句
#       expect_tools:          預期至少呼叫其中任一個（可選；空 = 允許不用工具）
#       expect_keywords:       回應中必須包含的關鍵詞（可選）
#       expect_not_keywords:   回應中不該出現的關鍵詞（可選）
#       expect_nonempty:       回應不該是空或 fallback message（預設 true）
#       notes:                 這題在驗什麼
#
# 執行：python tests/scenarios/run_suite.py
# 結果：每題 trace 上傳 Langfuse，summary 印 console + 寫 JSON。

suite_name: "CryptoMind multiturn regression v1"
description: |
  涵蓋 7 種情境：未知代號、跨主題切換、多輪代名詞、語言切換、tool 失敗容忍、
  小白問法、複雜推理。每個 scenario 是獨立 session。

scenarios:
  # ============================================================
  # 情境 1：未知代號（SNXX bug 回歸）
  # ============================================================
  - id: "S1-unknown-ticker"
    category: unknown_ticker
    language: "zh-TW"
    turns:
      - query: "SNXX 現在值得買嗎？"
        expect_tools: ["resolve_symbol", "us_stock_price", "web_search", "us_technical_analysis"]
        expect_keywords: ["SNXX", "SNDK"]
        expect_nonempty: true
        soft: true  # nemotron 對未知代號的遵從性不穩定；soft=true 時 fail 算 warning 不算 fail
        notes: |
          修復前 0 tool calls + fallback；修復後 claw_loop recovery 會 nudge，
          但 nemotron 對 SNXX 這類冷門代號仍可能直接回空（不是 code bug）。
          用 GPT/Claude 時通常能通過。
          soft=true：fail 時算 warning，不阻擋 suite 整體通過。

  # ============================================================
  # 情境 2：未知代號 + 冷門幣
  # ============================================================
  - id: "S2-unknown-crypto"
    category: unknown_ticker
    language: "zh-TW"
    turns:
      - query: "PEPE 幣現在多少錢？"
        expect_tools: ["get_crypto_price", "resolve_symbol", "web_search"]
        expect_keywords: ["PEPE"]
        expect_nonempty: true
        notes: "冷門幣也要能查到（fallback 到 CoinGecko）"

  # ============================================================
  # 情境 3：多輪 + 跨主題切換（在同一個 session 內）
  # ============================================================
  - id: "S3-cross-topic-switch"
    category: multiturn_context
    language: "zh-TW"
    soft: true  # nemotron 對「黃金 → commodity tool」連結不穩
    turns:
      - query: "比特幣現在多少錢？"
        expect_tools: ["get_crypto_price"]
        expect_keywords: ["比特幣", "BTC"]
        expect_nonempty: true
        notes: "建立 BTC 脈絡"
      - query: "台積電現在多少？"
        expect_tools: ["tw_stock_price", "resolve_symbol", "get_stock_price"]
        expect_keywords: ["台積電", "2330"]
        expect_nonempty: true
        notes: "切到台股，不該把台積電當成 BTC"
      - query: "那黃金呢？"
        expect_tools: ["get_commodity_price"]
        expect_keywords: ["黃金"]
        expect_nonempty: true
        notes: |
          切到大宗商品，'那' 要理解為新一個標的（不是台積電）。
          注意：nemotron 對「黃金 → commodity tool」連結不穩，
          若 LLM 說「沒這個工具」屬於 LLM 知識限制，不是 code bug；
          但『不該把黃金當成台積電的追問』。

  # ============================================================
  # 情境 4：多輪代名詞（測 history parser）
  # ============================================================
  - id: "S4-pronoun-resolution"
    category: multiturn_context
    language: "zh-TW"
    soft: true  # nemotron 對多輪代名詞有時間歇性空回
    turns:
      - query: "比較比特幣跟以太坊的差異，用表格列出來"
        expect_keywords: ["比特幣", "以太坊"]
        expect_nonempty: true
        notes: "產生多行表格（測 history parser 多行保留）"
      - query: "它們哪個風險比較高？"
        expect_keywords: ["比特幣", "以太坊"]
        expect_not_keywords: ["請問您想詢問"]
        expect_nonempty: true
        notes: "測 parser 修復：'它們' 必須理解為 BTC+ETH（修復前會反問）"

  # ============================================================
  # 情境 5：語言切換（zh-TW → en → zh-CN）
  # ============================================================
  - id: "S5-language-switch"
    category: language_switch
    language: "zh-TW"
    turns:
      - query: "Bitcoin price now?"
        expect_tools: ["get_crypto_price"]
        # 2026-07-19：放寬為任一即可。UI=zh-TW 時 LanguageAwareLLM 會把
        # 回應導向繁中，LLM 可能翻成「比特幣（BTC）」而非保留原文 "Bitcoin"。
        # 只要提到比特幣/Bitcoin/BTC 任一即可。
        expect_any_keyword: ["比特幣", "Bitcoin", "BTC"]
        expect_nonempty: true
        notes: "英文 query 但 UI 是 zh-TW"
      - query: "现在值得投资吗？"
        expect_nonempty: true
        notes: "簡中 query（測不會被回繁中）"
      - query: "Tell me the latest news"
        expect_tools: ["aggregate_news", "google_news", "web_search"]
        expect_nonempty: true
        notes: "英文 query 切回"

  # ============================================================
  # 情境 6：tool 失敗容忍（用一個絕對查不到的代號）
  # ============================================================
  - id: "S6-tool-failure-tolerance"
    category: tool_failure
    language: "zh-TW"
    soft: true  # nemotron 對不存在的幣間歇性回空
    turns:
      - query: "XYZNOTEXIST 這個幣的價格？"
        expect_nonempty: true
        expect_not_keywords: ["模型沒有產生回應"]
        notes: "不該崩潰；該嘗試查詢後明確說查無此幣"

  # ============================================================
  # 情境 7：小白問法（模糊、口語）
  # ============================================================
  - id: "S7-beginner-query"
    category: beginner
    language: "zh-TW"
    turns:
      - query: "我是新手，比特幣是什麼？聽說能賺錢但風險是什麼"
        expect_nonempty: true
        expect_keywords: ["比特幣"]
        notes: "口語模糊問法，要能理解並給結構化回答"
      - query: "那我要怎麼開始？"
        expect_nonempty: true
        notes: "代名詞 + 口語追問"

  # ============================================================
  # 情境 8：複雜推理（多標的比較 + 配置建議）
  # ============================================================
  - id: "S8-complex-reasoning"
    category: complex_reasoning
    language: "en"
    soft: true  # nemotron 對英文 volatility 比較的遵從性不穩
    turns:
      - query: "Compare BTC and ETH volatility, which is more volatile?"
        expect_tools: ["technical_analysis", "get_crypto_price", "web_search"]
        expect_keywords: ["volatility"]
        expect_nonempty: true
        notes: "複雜比較 + 英文"
      - query: "If I had $10000, how should I split between them based on risk?"
        expect_nonempty: true
        notes: "配置建議（不該反問 them 是什麼）"

  # ============================================================
  # 情境 9：閒聊（不該硬呼叫 tool）
  # ============================================================
  - id: "S9-smalltalk-no-tool"
    category: smalltalk
    language: "zh-TW"
    turns:
      - query: "你好"
        expect_nonempty: true
        expect_tools: []
        notes: "閒聊不該呼叫 tool（response_quality 有規範）"
      - query: "你能做什麼？"
        expect_nonempty: true
        notes: "能力詢問"

  # ============================================================
  # 情境 10：繁中稳定（確認 baseline 沒退化）
  # ============================================================
  - id: "S10-zh-tw-baseline"
    category: baseline
    language: "zh-TW"
    turns:
      - query: "比特幣最新新聞是什麼？"
        expect_tools: ["aggregate_news", "google_news"]
        expect_keywords: ["比特幣"]
        expect_nonempty: true
        notes: "基本查詢 + 繁中"

  # ============================================================
  # 情境 11：BTC 價格正確性（$0.00001047 垃圾價回歸）
  # ============================================================
  - id: "S11-btc-price-correctness"
    category: price_sanity
    language: "zh-TW"
    turns:
      - query: "比特幣現在多少錢？"
        expect_tools: ["get_crypto_price"]
        expect_keywords: ["比特幣", "BTC"]
        # 核心斷言：不該出現仿冒幣垃圾價（修補前的 $0.00001047）
        expect_not_keywords: ["0.000010", "0.000001", "找不到比特幣"]
        expect_nonempty: true
        notes: |
          回歸測試：修補前 BTC 可能回 $0.00001047（CoinGecko 仿冒幣）。
          合理 BTC 價應為五位數 USD（如 $63,000）。斷言不出現極小垃圾價。
      - query: "以太坊呢？"
        expect_tools: ["get_crypto_price"]
        expect_keywords: ["以太坊", "ETH"]
        expect_not_keywords: ["0.000010"]
        expect_nonempty: true
        notes: "連續追問 ETH，同樣驗證價格合理性"

  # ============================================================
  # 情境 12：韓股（之前完全沒測）
  # ============================================================
  - id: "S12-korean-stock"
    category: global_stock
    language: "zh-TW"
    turns:
      - query: "三星電子現在股價多少？"
        expect_tools: ["global_stock_price", "resolve_symbol"]
        expect_any_keyword: ["三星", "Samsung", "005930"]
        expect_nonempty: true
        notes: |
          韓股之前完全沒測。三星 005930.KS 應回 KRW 價格（五位數如 70000）。
          驗證韓股 provider 正常 + 不該把三星當加密或美股。
      - query: "它的市值大概多少？"
        expect_any_keyword: ["三星", "Samsung"]
        expect_nonempty: true
        notes: "代名詞「它」應指三星（測多輪上下文）"

  # ============================================================
  # 情境 13：美股正常查詢（之前只有 SNXX 未知代號）
  # ============================================================
  - id: "S13-us-stock-normal"
    category: global_stock
    language: "zh-TW"
    turns:
      - query: "蘋果（AAPL）現在多少錢？"
        expect_tools: ["us_stock_price", "resolve_symbol"]
        expect_any_keyword: ["蘋果", "Apple", "AAPL"]
        expect_nonempty: true
        notes: |
          正常美股查詢。AAPL 應回兩~三位數 USD。
          驗證不會誤把美股當加密（crypto guard 不該誤殺真美股）。
      - query: "輝達呢？"
        expect_any_keyword: ["輝達", "NVIDIA", "NVDA"]
        expect_nonempty: true
        notes: "中文名查詢 + 連續追問"

  # ============================================================
  # 情境 14：加密誤丟股票工具 regression（crypto guard 驗證）
  # ============================================================
  - id: "S14-crypto-not-misrouted"
    category: price_sanity
    language: "zh-TW"
    turns:
      - query: "幫我查比特幣的技術分析"
        expect_keywords: ["比特幣", "BTC"]
        # 不該出現美股技術分析工具的錯誤（代表被正確路由到 crypto 技術分析）
        expect_not_keywords: ["是加密貨幣，無法用"]
        expect_nonempty: true
        notes: |
          驗證 BTC 被正確路由到 crypto 技術分析工具，而非被丟給 us_technical_analysis
          觸發 crypto guard（雖 guard 會擋，但正確路由根本不該觸發 guard）。

  # ============================================================
  # 情境 15：多市場混合比較（跨市場切換 + 多標的同時）
  # ============================================================
  - id: "S15-multi-market-compare"
    category: multiturn_context
    language: "zh-TW"
    soft: true  # nemotron 對多標的同時查詢遵從性不穩
    turns:
      - query: "台積電、三星和蘋果現在分別多少錢？"
        expect_any_keyword: ["台積電", "2330"]
        expect_nonempty: true
        notes: |
          一次問三個不同市場（台/韓/美）的標的。測 agent 能否正確路由到
          三個不同 provider（tw/kr/us），不混淆。最容易出錯的綜合對話。
      - query: "那輝達呢？"
        expect_any_keyword: ["輝達", "NVDA"]
        expect_nonempty: true
        notes: "連續追問第四個標的（美股），測不會跟前述混淆"
      - query: "這幾檔哪個最近漲最多？"
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問", "請提供"]
        notes: |
          「這幾檔」要理解為前面所有股票。測多標的代名詞指代，
          不該反問釐清（前面的上下文已足夠明確）。

  # ============================================================
  # 情境 16：加密 → 股票跨資產代名詞混淆
  # ============================================================
  - id: "S16-cross-asset-pronoun"
    category: multiturn_context
    language: "zh-TW"
    soft: true
    turns:
      - query: "比特幣和台積電哪個適合長期投資？"
        expect_any_keyword: ["比特幣", "BTC"]
        expect_nonempty: true
        notes: "跨資產類別（加密 vs 股票）比較，建立兩者上下文"
      - query: "它的風險主要在哪裡？"
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問"]
        notes: |
          「它」在跨資產類別時最易混淆。應理解為「兩者各自的風險」
          或主動說明（修補前可能反問釐清）。

  # ============================================================
  # 情境 17：記憶連續性（說出偏好後後續是否記得）
  # ============================================================
  - id: "S17-memory-continuity"
    category: memory
    language: "zh-TW"
    soft: true  # 記憶需 DB + 整合，nemotron 遵從性不穩
    turns:
      - query: "我比較偏好穩定的藍籌股，不喜歡太高風險"
        expect_nonempty: true
        notes: "建立使用者偏好（應觸發 remember 工具寫入記憶）"
      - query: "那推薦我適合的投資標的"
        expect_nonempty: true
        notes: "測是否帶入上一輪的「穩定藍籌」偏好做推薦"
      - query: "比特幣適合我嗎？"
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問"]
        notes: |
          高風險的 BTC 對照使用者「不喜歡高風險」偏好。
          理想：應點出 BTC 高波動與使用者偏好不符。

  # ============================================================
  # 情境 18：極端短查詢 + 錯字（邊界容忍）
  # ============================================================
  - id: "S18-short-and-typo"
    category: edge_case
    language: "zh-TW"
    soft: true
    turns:
      - query: "btc"
        expect_any_keyword: ["比特幣", "BTC", "Bitcoin"]
        expect_nonempty: true
        notes: "極端短查詢（全小寫），測能正確識別為比特幣"
      - query: "2330"
        expect_any_keyword: ["台積電", "2330"]
        expect_nonempty: true
        notes: "純數字（台股代號），測能正確路由到台股"
      - query: "appl 價格"  # 故意打錯（Apple 的正確是 AAPL）
        expect_nonempty: true
        notes: |
          錯字容忍。appl 不是有效 ticker，測 agent 會嘗試解析/模糊匹配，
          或明確說查不到（不該崩潰或回垃圾）。

  # ============================================================
  # 情境 19：判斷型問題（investment-judgment skill 觸發）
  # ============================================================
  - id: "S19-judgment-structured"
    category: judgment
    language: "zh-TW"
    soft: true  # 結構化判斷需強模型，nemotron 遵從性不穩
    turns:
      - query: "台積電現在適合買嗎？"
        expect_any_keyword: ["台積電", "2330"]
        expect_nonempty: true
        expect_not_keywords: ["0.000010", "是加密貨幣"]
        notes: |
          判斷型問題，應觸發 investment-judgment skill（利多→利空→綜合結構）。
          測不會回垃圾價、不會把台積電當加密。內容應含正反兩面觀點。
      - query: "那以太坊呢？值不值得投資？"
        expect_any_keyword: ["以太坊", "ETH"]
        expect_nonempty: true
        notes: "連續判斷型問題，測跨資產切換 + 結構化判斷"

  # ============================================================
  # 情境 20：中英混雜 + 代號（全球化用戶常見）
  # ============================================================
  - id: "S20-mixed-lang-ticker"
    category: language_switch
    language: "zh-TW"
    soft: true
    turns:
      - query: "NVDA 跟 TSM 的 technical 比較一下"
        expect_any_keyword: ["NVDA", "TSM", "輝達", "台積"]
        expect_nonempty: true
        notes: |
          中英混雜 + 英文 ticker。TSM 是台積電 ADR（美股），
          測能正確識別兩個都是美股代號並比較技術面。
      - query: "Samsung 和比特幣 recent news 呢？"
        expect_nonempty: true
        notes: "中英混雜 + 跨資產（韓股 + 加密）新聞查詢"

  # ============================================================
  # 情境 21：連續多輪深度追問（測不會半途崩潰/空回）
  # ============================================================
  - id: "S21-deep-multiturn"
    category: multiturn_context
    language: "zh-TW"
    soft: true
    turns:
      - query: "輝達最新財報表現如何？"
        expect_any_keyword: ["輝達", "NVDA"]
        expect_nonempty: true
        notes: "建立 NVDA 上下文（基本面）"
      - query: "技術面呢？"
        expect_any_keyword: ["輝達", "NVDA"]
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問"]
        notes: "「呢」追問技術面，測代名詞指代 NVDA"
      - query: "機構怎麼看？"
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問"]
        notes: "連續第三輪追問（機構持倉/評級），測不會在第3輪失憶"
      - query: "綜合來說現在可以買嗎？"
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問"]
        notes: |
          第4輪要求綜合判斷。測 agent 能整合前3輪的基本/技術/機構資訊
          給出結構化判斷，不該反問「綜合什麼」。

  # ============================================================
  # 情境 22：港股 + 日股（之前完全沒測的市場）
  # ============================================================
  - id: "S22-hk-jp-stock"
    category: global_stock
    language: "zh-TW"
    soft: true
    turns:
      - query: "騰訊現在股價多少？"
        expect_any_keyword: ["騰訊", "Tencent", "0700"]
        expect_nonempty: true
        notes: "港股（0700.HK），測港股市場正常運作"
      - query: "豐田汽車呢？"
        expect_any_keyword: ["豐田", "Toyota", "7203"]
        expect_nonempty: true
        notes: "日股（7203.T），測日股市場 + 連續追問切換市場"

  # ============================================================
  # 以下 S23-S30 基於網路真實使用者問題搜集（Reddit/財經顧問/論壇高頻問句）
  # 來源：r/Bitcoin, r/CryptoCurrency, Investopedia, Fidelity, Suze Orman,
  #       ZeroScam, 雪球, 騰訊雲等。涵蓋真實使用者最常問的 8 大面向。
  # ============================================================

  # ============================================================
  # 情境 23：買賣時機判斷（Reddit/財經顧問最高頻問題）
  # "Should I buy now or wait?" "Should I sell at this price?"
  # ============================================================
  - id: "S23-buy-sell-timing"
    category: judgment
    language: "zh-TW"
    soft: true  # nemotron 對判斷型遵從性不穩
    turns:
      - query: "比特幣現在這個價位該買嗎？還是再等等？"
        expect_any_keyword: ["比特幣", "BTC"]
        expect_nonempty: true
        expect_not_keywords: ["0.000010", "是加密貨幣，無法用"]
        notes: |
          Reddit r/Bitcoin 最高頻問題 "Should I buy now or wait?"。
          應給出結構化判斷（利多/利空/觀察點），不該只回價格或空回應。
      - query: "如果已經持有，現在該賣嗎？"
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問"]
        notes: |
