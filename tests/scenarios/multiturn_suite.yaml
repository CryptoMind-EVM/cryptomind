        expect_nonempty: true
        expect_any_keyword: ["詐騙", "風險", "小心", "可疑", "不要"]
        notes: |
          ZeroScam/r/CryptoScams 真實案例。保證高獲利 + 轉帳是典型詐騙特徵。
          agent 應明確警告「高度可疑/疑似詐騙」，不該說「可以試試」。
      - query: "那如果是朋友推薦的也是詐騙嗎？"
        expect_nonempty: true
        expect_not_keywords: ["請問您想詢問"]
        notes: "連續追問，測不會反問釐清（上文明確）"

